[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uplift-lab"
dynamic = ["version"]
description = "A/B analysis (CUPED, SRM, power, always-valid sequential tests) and uplift modelling (meta-learners, Qini/AUUC, policy value) on public RCT data, deployed and monitored."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tan Tran" }]
keywords = ["uplift-modeling", "causal-inference", "ab-testing", "cuped", "sequential-testing",
            "experimentation", "meta-learners", "qini", "mlflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
# Core: load and score an exported model. The analysis stack is the `analysis` extra, so the
# serving image (core + `serve`) leaves it out. LightGBM itself still requires scipy.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "lightgbm>=4.5",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
analysis = ["pyarrow>=16", "scipy>=1.13", "scikit-learn>=1.5", "statsmodels>=0.14.2"]
report = ["uplift-lab[analysis]", "matplotlib>=3.8"]
mlflow = ["uplift-lab[analysis]", "mlflow>=3.0,<4"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8"]
dev = [
  "uplift-lab[serve,report]",
  "httpx2>=2.9",  # Starlette's TestClient transport (replaces httpx there)
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scipy-stubs>=1.13",
]

[project.scripts]
uplift-hillstrom-report = "uplift_lab.reports.hillstrom:main"
uplift-sequential-report = "uplift_lab.reports.sequential:main"
uplift-criteo-report = "uplift_lab.reports.criteo_uplift:main"
uplift-serve-benchmark = "uplift_lab.serving.benchmark:main"
uplift-drift-report = "uplift_lab.reports.drift:main"
uplift-metric-gate = "uplift_lab.gate.cli:main"

[project.urls]
Homepage = "https://github.com/tantn89/uplift-experimentation"
Issues = "https://github.com/tantn89/uplift-experimentation/issues"

[tool.hatch.version]
path = "src/uplift_lab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift_lab"]
# Written by databricks/build_wheel.py for a bundle deploy (git SHA and dirty flag); git-ignored,
# so it has to be listed to enter the wheel. Absent in every other build.
artifacts = ["src/uplift_lab/build_info.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "lightgbm.*", "sklearn.*", "statsmodels.*", "mlflow.*"]
ignore_missing_imports = true

# MLflow is an optional extra: without it installed, PythonModel is untyped (Any).
[[tool.mypy.overrides]]
module = ["uplift_lab.uplift.pyfunc_model"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: downloads real datasets; run explicitly with -m network"]
