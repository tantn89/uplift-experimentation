name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  # Unit tests use synthetic fixtures only: no dataset download, no network.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -rxXs --cov=uplift_lab --cov-report=term-missing

  # The drift report on seeded synthetic data (no dataset download), kept as a build artifact.
  # It is also a regression gate: the job fails if unshifted traffic is not "ok" or the
  # covariate shift is not "alert". The artifact is uploaded either way, for inspection.
  drift-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: >-
          uplift-drift-report --synthetic 20000 --traffic-rows 5000 --n-estimators 50
          --output-dir reports/drift
          --expect no_shift=ok --expect covariate_shift=alert
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/drift
          if-no-files-found: error
          retention-days: 14

  # Uplift quality gate on a seeded synthetic RCT (no download): every learner's Qini and its
  # 10%-budget policy value against the committed evals/metric-gate-baseline.json. It fails when
  # an estimate drops below the baseline's lower 95% bootstrap bound or a Qini interval stops
  # excluding 0. Refresh the baseline in the same pull request: uplift-metric-gate --update-baseline
  metric-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[analysis]"
      - run: uplift-metric-gate
      - if: always()
        run: |
          if [ -f reports/metric-gate/summary.md ]; then
            cat reports/metric-gate/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # Optional: MLflow is a heavy extra, so its round-trip tests (log, register, load the
  # champion, serve it from the registry) run in their own job that does not block merges.
  mlflow-round-trip:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,mlflow]"
      - run: >-
          pytest -rxXs tests/test_uplift_tracking.py
          tests/test_serving_config.py::test_registered_champion_serves_like_the_export
