name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  # Unit tests use synthetic fixtures only: no dataset download, no network.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -rxXs --cov=uplift_lab --cov-report=term-missing

  # The drift report on seeded synthetic data (no dataset download), kept as a build artifact.
  drift-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: >-
          uplift-drift-report --synthetic 20000 --traffic-rows 5000 --n-estimators 50
          --output-dir reports/drift
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/drift
          if-no-files-found: error
          retention-days: 14

  # Optional: MLflow is a heavy extra, so its round-trip tests (log, register, load the
  # champion, serve it from the registry) run in their own job that does not block merges.
  mlflow-round-trip:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,mlflow]"
      - run: >-
          pytest -rxXs tests/test_uplift_tracking.py
          tests/test_serving_config.py::test_registered_champion_serves_like_the_export
